<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>강아지 OO이의 가족을 찾아요!</title>
    <style>
        body { font-family: sans-serif; text-align: center; background-color: #f9f9f9; padding: 20px; }
        .container { background: white; padding: 30px; border-radius: 15px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); max-width: 400px; margin: auto; }
        img { max-width: 100%; border-radius: 10px; }
        h1 { color: #333; margin-top: 20px; }
        p { color: #666; line-height: 1.6; margin-bottom: 20px; }
        .contact-btn {
            display: inline-block;
            background-color: #ffe000; /* 카카오톡 색상 */
            color: #3e2723;
            padding: 12px 24px;
            border-radius: 25px;
            text-decoration: none;
            font-weight: bold;
            font-size: 1.1em;
            transition: background 0.3s;
        }
        .contact-btn:hover { background-color: #ffd600; }
    </style>
</head>
<body>
    <div class="container">
        <!-- [사진 필수] 여기에 강아지 사진을 올립니다. -->
        <img src="https://via.placeholder.com/400x300.png?text=Puppy+Photo" alt="강아지 사진">
        
        <!-- [이름] 강아지 이름을 적어주세요. -->
        <h1>저는 '멍멍이'예요</h1>

        <!-- [내용] 아주 간단한 정보를 적습니다. -->
        <p>
            귀여운 믹스견이고, 1살입니다. <br>
            사람을 아주 좋아하고 활발해요. <br>
            중성화 완료되었고, 접종도 마쳤습니다.<br>
            평생 가족을 기다리고 있어요.
        </p>
        
        <!-- [오픈카톡 링크] 자신의 오픈카톡 링크를 넣어주세요. -->
        <a href="https://open.kakao.com/o/sYOUR_LINK" class="contact-btn">
            카카오톡으로 입양 문의하기 (비공개)
        }
        </a>
    </div>
</body>
</html>
